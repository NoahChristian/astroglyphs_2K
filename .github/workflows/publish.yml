name: Publish to PyPI

# Publishes on a GitHub Release via PyPI Trusted Publishing (OIDC) — no API token
# stored. ONE-TIME setup on PyPI before the first release: add a "pending publisher" for
# project `astroglyphs_2K` with owner=NoahChristian, repo=astroglyphs_2K,
# workflow=publish.yml, environment=pypi.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # required for trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
