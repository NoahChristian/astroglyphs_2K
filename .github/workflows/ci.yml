name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Pure data + stdlib, zero runtime deps. Tests exercise the committed generated data
      # (_data.py) and the bundled font files; fonttools + brotli (test extra) only read their
      # cmaps and OS/2 metadata — brotli is required to open the .woff2 files at all.
      - name: Install astroglyphs_2K + test deps
        run: python -m pip install ".[test]"

      - name: Lint (ruff)
        run: python -m ruff check src/astroglyphs_2K

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Run tests
        run: python -m pytest -q
